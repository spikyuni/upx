name: codeql
# The `main` ruleset requires CodeQL results. CodeQL default setup skips a pull request that
# touches no scannable file (a Renovate PR that edits only renovate.json), so the ruleset
# waits forever. This workflow analyzes every pull request.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: '40 23 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    uses: repobuddy/.github/.github/workflows/codeql-analysis.yml@v2
    permissions:
      actions: read
      contents: read
      security-events: write
